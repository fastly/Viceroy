[package]
name = "trap-test"
description = "A test to exercise the Viceroy functionality in which a hostcall experiences a FatalError and terminates the instance."
version = "0.1.0"
authors = []
edition = "2024"
license = "Apache-2.0 WITH LLVM-exception"
publish = false

[dependencies]
anyhow = "1.0.31"
futures = "0.3.0"
http = "0.2.1"
hyper = "=0.14.26"
tokio = { version = "1.49.0", features = ["full"] }
tracing-subscriber = "0.2.19"
viceroy-lib = { path = "../../..", features = ["test-fatalerror-config"] }

[dev-dependencies]
test-fixtures-artifacts = { path = "../../../test-fixtures/artifacts" }

# trap-test enables viceroy-lib's `test-fatalerror-config` feature, which via Cargo feature
# unification would otherwise apply to every other build in the root workspace, forcing full
# rebuilds. An empty `[workspace]` table here keeps trap-test out of the root workspace (see
# ../../../Cargo.toml) so that feature stays isolated, and CI can build/test it in its own
# parallel job (see ../../../Makefile and ../../../.github/workflows/test.yml).
[workspace]
