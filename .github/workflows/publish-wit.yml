name: Publish compute.wit

# Workflow to publish fastly:compute to GHCR

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
      attestations: write

    env:
      WKG_VERSION: 0.15.0
      WASM_TOOLS_VERSION: 1.255.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@732870f031d2fb36309d0deaf36abcc704a7be65 # v1.20.1

      - name: Install wkg
        shell: bash
        run: cargo binstall -y "wkg@${{ env.WKG_VERSION }}"

      - name: Install wasm-tools
        shell: bash
        run: cargo binstall -y "wasm-tools@${{ env.WASM_TOOLS_VERSION }}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ORG_PAT }}

      - name: Build WIT package
        shell: bash
        run: |
          # We want to publish compute.wit, not adapter.wit or viceroy.wit, so
          # copy the WIT dir, delete those, and put compute.wit at the top level.
          cp -r wasm_abi/wit "$GITHUB_WORKSPACE/fastly-compute-wit"
          rm -r "$GITHUB_WORKSPACE/fastly-compute-wit/deps/fastly-adapter"
          rm "$GITHUB_WORKSPACE/fastly-compute-wit/viceroy.wit"
          mv "$GITHUB_WORKSPACE/fastly-compute-wit/deps/fastly/compute.wit" "$GITHUB_WORKSPACE/fastly-compute-wit"
          rmdir "$GITHUB_WORKSPACE/fastly-compute-wit/deps/fastly"

          # Use wasm-tools component wit instead of wkg wit build because the
          # former understands deps directories.
          wasm-tools component wit "$GITHUB_WORKSPACE/fastly-compute-wit" --wasm -o "$GITHUB_WORKSPACE/fastly-compute.wasm"

      - name: Publish to GitHub Container Registry
        id: publish
        uses: bytecodealliance/wkg-github-action@5b7005d1fc81c8c3380a059e58345033e3a97638 # `main`, at the time of this comment, because we need bytecodealliance/wkg-github-action#9
        with:
          oci-reference-without-tag: 'ghcr.io/fastly/viceroy/fastly-compute'
          file: 'fastly-compute.wasm'
          description: 'The APIs of the Fastly Compute platform'
          source: 'https://github.com/fastly/Viceroy'
          homepage: 'https://www.fastly.com/documentation/guides/compute/'
          version: '0.1.0'
          licenses: 'Apache-2.0 WITH LLVM-exception'

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/fastly/viceroy/fastly-compute
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          github-token: ${{ secrets.ORG_PAT }}
