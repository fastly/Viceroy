[package]
name = "test-fixtures-artifacts"
version = "0.21.1"
description = "Cross-compiles the guest wasm programs in `test-fixtures` for the integration tests."
authors = ["Fastly"]
edition = "2024"
license = "Apache-2.0 WITH LLVM-exception"
publish = false

[build-dependencies]
anyhow = { workspace = true }
cargo_metadata = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
# `preserve_order` is required for the deserializer to yield table entries in
# document order rather than sorted, which `env` in fixtures.toml relies on.
toml = { version = "1.1.6", features = ["preserve_order"] }
strum = { version = "0.28.0", features = ["derive"] }
