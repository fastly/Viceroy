name: Test using various Rust versions

on:
  schedule:
    - cron: "2 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    strategy:
      matrix:
        rust:
          - stable
          - beta
          - nightly
      fail-fast: false
    # An environment override takes precedence over rust-toolchain.toml;
    # changing rustup's default alone still builds with the pinned toolchain.
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    runs-on: ${{ case(vars.LINUX_RUNNER_AMD64 != '', vars.LINUX_RUNNER_AMD64, 'ubuntu-24.04') }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Rust
      run: |
        rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal \
          --component rustfmt,clippy \
          --target wasm32-wasip1,wasm32-wasip2,wasm32-unknown-unknown

    - name: Show active toolchain
      run: |
        rustup show active-toolchain
        rustc --version --verbose
        cargo --version

    - run: make ci
