name: Test

on: [pull_request]

env:
  CACHE_GENERATION: 0
jobs:
  test:
    strategy:
      matrix:
        platform: [forge-amd64-medium]
    runs-on: ${{ matrix.platform }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
    - name: Generate access token for organization
      uses: actions/create-github-app-token@v1
      id: fastly-token
      with:
        app-id: ${{ secrets.FASTLY_TOKEN_GENERATOR_ID }}
        private-key: ${{ secrets.FASTLY_TOKEN_GENERATOR_KEY }}
        owner: ${{ github.repository_owner }}
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        submodules: recursive
        token: ${{ steps.fastly-token.outputs.token }}
    - name: Add authentication rules
      env:
        FASTLY_TOKEN: ${{ steps.fastly-token.outputs.token }}
      run: |
        git config --global --add url."https://x-access-token:$FASTLY_TOKEN@github.com/".insteadOf "ssh://git@github.com/"
        git config --global --add url."https://x-access-token:$FASTLY_TOKEN@github.com/".insteadOf "git@github.com:"
    - name: Cache cargo
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
        key: ${{ matrix.platform }}-cargo-v${{ env.CACHE_GENERATION }}-${{ hashFiles('**/Cargo.lock') }}
    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.9
    - name: Check formatting
      run: cargo fmt --all -- --check
      shell: bash
    - name: test
      run: make ci
      shell: bash
    - name: adapter
      run: cd wasm_abi/adapter && cargo build --release -p viceroy-component-adapter --target wasm32-unknown-unknown

  # Run the trap test in an isolated job. It needs different cargo features than the usual build, so
  # it entails rebuilding the whole workspace if we combine them in a single job. This way, we
  # achieve some parallelism via Actions jobs.
  trap-test:
    strategy:
      matrix:
        platform: [forge-amd64-medium]
    runs-on: ${{ matrix.platform }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
    - name: Generate access token for organization
      uses: actions/create-github-app-token@v1
      id: fastly-token
      with:
        app-id: ${{ secrets.FASTLY_TOKEN_GENERATOR_ID }}
        private-key: ${{ secrets.FASTLY_TOKEN_GENERATOR_KEY }}
        owner: ${{ github.repository_owner }}
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        submodules: recursive
        token: ${{ steps.fastly-token.outputs.token }}
    - name: Add authentication rules
      env:
        FASTLY_TOKEN: ${{ steps.fastly-token.outputs.token }}
      run: |
        git config --global --add url."https://x-access-token:$FASTLY_TOKEN@github.com/".insteadOf "ssh://git@github.com/"
        git config --global --add url."https://x-access-token:$FASTLY_TOKEN@github.com/".insteadOf "git@github.com:"
    - name: Cache cargo
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
        key: ${{ matrix.platform }}-cargo-trap-v${{ env.CACHE_GENERATION }}-${{ hashFiles('**/Cargo.lock') }}
    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.9
    - name: trap-test
      run: make trap-test-ci
      shell: bash
